<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrapper">
    <!-- 左侧面板 -->
    <div class="side-panel panel-left">
      <div class="panel-title">Flappy Bird</div>
      <div class="panel-divider"></div>
      <div class="stat-block">
        <div class="stat-label">得分</div>
        <div class="stat-value" id="panel-score">0</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">最高分</div>
        <div class="stat-value best" id="panel-best">0</div>
      </div>
      <div class="panel-divider"></div>
      <button class="sound-btn" id="sound-btn" title="音效开关">
        <span class="sound-icon">🔊</span>
        <span class="sound-label">音效已开启</span>
      </button>
    </div>

    <!-- 游戏区域 -->
    <div class="game-container">
      <canvas id="canvas" width="400" height="700"></canvas>
      <input type="text" id="name-input" class="name-input" maxlength="3" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" />
    </div>

    <!-- 右侧面板 -->
    <div class="side-panel panel-right">
      <div class="panel-title">🏆 排行榜</div>
      <div class="panel-divider"></div>
      <div class="leaderboard-list" id="leaderboard-list">
        <div class="lb-placeholder">加载中...</div>
      </div>
      <div class="panel-divider"></div>
      <div class="player-id-area" id="player-id-area">
        <span class="player-id-label">你的 ID：</span>
        <span class="player-id-value" id="player-id-value">未设置</span>
      </div>
      <p class="panel-tip" style="margin-top:8px;">进榜自动记录<br>按 M 修改 ID</p>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
